apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  releaseName: harbor
  chart:
    spec:
      chart: harbor
      version: v1.17.1
      sourceRef:
        kind: HelmRepository
        name: harbor
  interval: 50m
  install:
    remediation:
      retries: 3
  values:
    externalURL: https://harbor.kirintor.benjaminmnoer.dk
    existingSecretAdminPassword: harbor-admin-secret
    existingSecretAdminPasswordKey: admin-password
    database:
      type: external
      external:
        # CNPG primary service of the shared cluster (postgres namespace).
        host: shared-pg-cluster-rw.postgres.svc.cluster.local
        port: "5432"
        username: harbor_user
        coreDatabase: harbor
        existingSecret: harbor-postgres-secret
        # In-cluster traffic only; CNPG's default pg_hba accepts scram-sha-256
        # without TLS.
        sslmode: disable
      # Defaults are 900/100 *per pod* (core, jobservice, registry, exporter),
      # which cannot fit inside the cluster's max_connections=200.
      maxOpenConns: 20
      maxIdleConns: 10
    expose:
      type: ClusterIP
      tls:
        auto:
          commonName: "*.harbor.svc.cluster.local"