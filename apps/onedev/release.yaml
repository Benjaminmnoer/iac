apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: onedev
    namespace: onedev
spec:
    releaseName: onedev
    chart:
        spec:
            chart: onedev
            sourceRef:
                kind: HelmRepository
                name: onedev
    interval: 50m
    install:
        remediation:
            retries: 3
    values:
        persistence:
            storageClassName: smb-storage-class
            selector:
                matchLabels:
                    app: onedev
        database:
            external: true
            type: postgresql
            # CNPG primary service of the shared cluster (postgres namespace).
            host: shared-pg-cluster-rw.postgres.svc.cluster.local
            port: "5432"
            name: onedev
            user: onedev_user
            maximumPoolSize: "25"
    # The chart has no existingSecret support: it renders `database.password`
    # into its own `onedev-secrets` Secret, so the password is supplied as a
    # values fragment from a Secret that Helm does not own.
    valuesFrom:
        - kind: Secret
          name: onedev-db-credentials
          valuesKey: values.yaml
