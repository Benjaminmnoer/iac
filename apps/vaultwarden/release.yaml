apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  releaseName: vaultwarden
  chart:
    spec:
      chart: vaultwarden
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
  interval: 50m
  install:
    remediation:
      retries: 3
  values:
    domain: "https://vault.kirintor.benjaminmnoer.dk"
    image:
      registry: harbor.kirintor.benjaminmnoer.dk/vaultwarden
      pullSecrets:
        - name: harbor-secret
    service:
      type: ClusterIP
    database:
      # "postgresql" makes the chart emit PGHOST/PGPORT/PGDATABASE/PGUSER and a
      # DATABASE_URL derived from them, instead of one opaque connection string,
      # so the target stays reviewable here.
      type: postgresql
      host: shared-pg-cluster-rw.postgres.svc.cluster.local
      port: "5432"
      dbName: vaultwarden
      username: vaultwarden_user
      existingSecret: vaultwarden-postgres-creds
      # Defaults to "username"; empty means PGUSER comes from `username` above
      # and the Secret only carries the password.
      existingSecretUserKey: ""
    adminToken:
      existingSecret: vaultwarden-admin-creds
      existingSecretKey: adminToken
