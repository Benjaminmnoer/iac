apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-pg-cluster
  namespace: postgres
spec:
  instances: 2
  # Image is resolved from the ClusterImageCatalog so minor upgrades are a
  # one-line change there instead of a stale pinned tag here.
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 16
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  postgresql:
    # Left unset, the cluster inherits PostgreSQL's defaults: 128MB
    # shared_buffers and max_connections=100. These are sized for the 2Gi
    # container limit (CNPG's rule of thumb is ~25% for shared_buffers).
    parameters:
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      max_connections: "200"
    synchronous:
      method: any
      number: 1
      dataDurability: required
  resources:
    requests:
      memory: "1024Mi"
      cpu: 1
    limits:
      memory: "2048Mi"
      cpu: 2
  storage:
    size: 100Gi
    storageClass: local-storage
  managed:
    roles:
      - name: harbor_user
        ensure: present
        login: true
        connectionLimit: 80
        passwordSecret:
          name: harbor-postgres-credentials
      - name: onedev_user
        ensure: present
        login: true
        connectionLimit: 30
        passwordSecret:
          name: onedev-postgres-credentials
      - name: vaultwarden_user
        ensure: present
        login: true
        connectionLimit: 15
        passwordSecret:
          name: vaultwarden-postgres-credentials
