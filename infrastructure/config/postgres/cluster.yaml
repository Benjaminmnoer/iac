apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-pg-cluster
  namespace: postgres
spec:
  instances: 2
  # Image is resolved from the ClusterImageCatalog so minor upgrades are a
  # one-line change there instead of a stale pinned tag here.
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 16
  # Switch the primary over before replacing it, instead of restarting it in
  # place (default "unsupervised" causes a short write outage).
  primaryUpdateStrategy: switchover
  postgresql:
    # Left unset, the cluster inherits PostgreSQL's defaults: 128MB
    # shared_buffers and max_connections=100. These are sized for the 2Gi
    # container limit (CNPG's rule of thumb is ~25% for shared_buffers).
    parameters:
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      # Harbor alone defaults to maxOpenConns=900 / maxIdleConns=100, so its
      # chart values must be lowered to fit under this cap.
      max_connections: "200"
    synchronous:
      method: any
      number: 1
      dataDurability: required
  resources:
    requests:
      memory: "1024Mi"
      cpu: 1
    limits:
      memory: "2048Mi"
      cpu: 2
  storage:
    size: 100Gi
    storageClass: local-storage
